name: CI Build & Deploy Next.js (standalone)

on:
  push:
    branches: ['main']
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: new-admin-gradegy
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      # (Optional) prune devDependencies to slim artifact if your devDeps aren't needed at runtime
      # - name: Prune devDependencies
      #   run: yarn workspaces focus --production || true

      - name: Archive to deploy
        run: |
          mkdir -p ./_deploy
          rsync -a --exclude '.git' --exclude '.github' ./ ./_deploy/
          # Keep node_modules since we'll run `next start` on Azure

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: new-admin-gradegy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: ./_deploy
