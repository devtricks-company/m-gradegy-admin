name: Build and deploy Node.js app to Azure Web App - new-admin-gradegy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn' # use 'npm' if you switch to npm

      - name: Install & build (Yarn)
        run: |
          yarn install --frozen-lockfile
          yarn build

      # Prepare a minimal deploy folder rooted at the standalone server
      - name: Stage standalone bundle
        run: |
          mkdir -p deploy
          cp -r .next/standalone/* deploy/
          mkdir -p deploy/.next/static
          cp -r .next/static/* deploy/.next/static/
          [ -d public ] && cp -r public deploy/public || true

      - name: Create zip
        run: (cd deploy && zip -r ../app.zip .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: package

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'new-admin-gradegy'
          slot-name: 'Production'
          package: app.zip
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
